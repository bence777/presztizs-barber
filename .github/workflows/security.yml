name: Security and regression
on:
  pull_request:
  push:
    branches: [main, security-hardening]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: https://fixture.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      SUPABASE_SECRET_KEY: sb_secret_ci_fixture
      SESSION_SIGNING_SECRET: ci-fixture-signing-value-never-a-production-secret
      SITE_URL: https://demeters.hu
      DEMETERS_BUILD_DIR: .next-security
      DEMETERS_PREVIEW_URL: http://127.0.0.1:3112
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:secrets
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Build fixture production app with enforced CSP
        run: NODE_OPTIONS=--require=./tests/fixtures/public-seo-fetch.cjs CSP_MODE=enforce npm run build
      - name: HTTP and browser regression
        run: |
          NODE_OPTIONS=--require=./tests/fixtures/public-seo-fetch.cjs CSP_MODE=enforce npm run start -- --port 3112 > /tmp/demeters-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3112/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:auth
          npm run test:http
          npm run test:security-ui
          npm run test:privacy
          npm run test:seo
          npm run test:ui
          npm run test:services
          npm run test:isolation
          npm run test:responsive
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-evidence
          path: |
            /tmp/demeters-ci-server.log
            /tmp/demeters-qa
